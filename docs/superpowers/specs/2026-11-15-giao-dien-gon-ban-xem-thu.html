<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Studio — Bản xem thử giao diện gọn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #FFFFFF; --side: #F9FAFB; --soft: #F4F4F5; --line: #E4E4E7;
    --ink: #09090B; --body: #18181B; --nav: #52525B; --micro: #A1A1AA; --mute: #71717A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; line-height: 1.6; color: var(--body);
    background: var(--canvas); height: 100vh; overflow: hidden; display: flex;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  code { font-family: Consolas, 'Courier New', monospace; font-size: 12px; background: var(--soft); border-radius: 4px; padding: 1px 5px; color: #3F3F46; overflow-wrap: anywhere; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- Thanh bên ---------- */
  .sidebar {
    width: 240px; flex: none; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100vh; transition: margin-left .18s ease;
  }
  body.collapsed .sidebar { margin-left: -240px; }
  .proj { margin: 12px 12px 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: flex; align-items: center; gap: 8px; text-align: left; width: calc(100% - 24px); }
  .proj b { display: block; font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.3; }
  .proj small { display: block; font-size: 11.5px; color: var(--mute); line-height: 1.3; }
  .navscroll { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .micro { font-size: 11.5px; font-weight: 500; color: var(--micro); padding: 16px 8px 6px; }
  .nav {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left;
    font-size: 13.5px; font-weight: 500; color: var(--nav); padding: 7px 8px; border-radius: 6px; margin: 1px 0;
  }
  .nav:hover, .nav[aria-current="page"] { background: var(--soft); color: var(--ink); }
  .nav .num { margin-left: auto; font-size: 11.5px; color: var(--micro); font-variant-numeric: tabular-nums; }
  .nav .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .nav .dot.off { background: transparent; border: 1.5px solid var(--micro); }
  .sidefoot { border-top: 1px solid var(--line); padding: 8px 12px 12px; }

  /* ---------- Vùng chính ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .top { height: 52px; flex: none; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; gap: 12px; }
  .top .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 6px; color: var(--nav); }
  .icon-btn:hover { background: var(--soft); color: var(--ink); }
  .crumb { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb b { color: var(--ink); font-weight: 500; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 9999px; padding: 6px 14px; width: 300px; max-width: 34vw; color: var(--mute); font-size: 13px; }
  .search kbd { margin-left: auto; font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: #fff; }
  .top .right { display: flex; justify-content: flex-end; align-items: center; gap: 14px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
  .stat { display: inline-flex; align-items: center; gap: 6px; }
  .stat i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .work { flex: 1; min-height: 0; display: flex; }
  .scroll { flex: 1; min-width: 0; overflow-y: auto; }
  .canvas { max-width: 1100px; margin: 0 auto; padding: 36px 32px 80px; }

  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); margin: 0; line-height: 1.3; text-wrap: balance; }
  .lede { color: var(--mute); margin: 4px 0 0; max-width: 62ch; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: #fff; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #27272A; }
  .btn.ghost { border-color: transparent; color: var(--nav); }
  h2 { font-size: 14px; font-weight: 600; color: var(--ink); margin: 30px 0 10px; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 11px; font-weight: 500; border: 1px solid var(--line); border-radius: 9999px; padding: 0 8px; color: var(--nav); line-height: 18px; white-space: nowrap; }
  .tag.solid { background: var(--ink); color: #fff; border-color: var(--ink); }
  .card { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .pad { padding: 16px 18px; }
  .grid { display: grid; gap: 12px; }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  @media (max-width: 900px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .search { display: none; } .top { grid-template-columns: 1fr auto; } }
  .pick { text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--body); }
  .pick b { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .pick span { display: block; font-size: 12.5px; color: var(--mute); line-height: 1.45; margin-top: 2px; }
  .pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .pick:disabled { background: var(--side); cursor: default; }
  .pick:disabled b { color: var(--mute); }
  textarea.big { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font: inherit; font-size: 14.5px; color: var(--body); resize: vertical; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sel { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: #fff; color: var(--body); display: inline-flex; gap: 6px; align-items: center; }
  .sel span { color: var(--mute); }
  .note { font-size: 12.5px; color: var(--mute); margin-top: 8px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tab { border: 0; background: transparent; font-size: 13.5px; font-weight: 500; color: var(--nav); padding: 8px 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .list > div { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: start; }
  .list > div:first-child { border-top: 0; }
  .list .n { font-size: 12px; color: var(--micro); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .list .m { font-size: 12px; color: var(--mute); white-space: nowrap; padding-top: 2px; }
  .ph { background: var(--soft); border-radius: 8px; aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--micro); font-size: 11.5px; }
  .scene { text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 8px; color: var(--body); }
  .scene:hover { border-color: #A1A1AA; }
  .scene .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--mute); padding: 8px 4px 2px; }
  .scene .meta b { color: var(--ink); font-weight: 500; }
  .meter { height: 6px; background: var(--soft); border-radius: 9999px; overflow: hidden; position: relative; }
  .meter i { display: block; height: 100%; background: var(--ink); border-radius: 9999px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 13px; }
  .kv span { color: var(--mute); }
  .steps5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
  .steps5 div { font-size: 11.5px; color: var(--mute); border-top: 2px solid var(--line); padding-top: 6px; }
  .steps5 div.done { border-color: var(--ink); color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--micro); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.c { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tablewrap { overflow-x: auto; }

  /* ---------- Ngăn kéo bên phải ---------- */
  .drawer { width: 0; flex: none; border-left: 0 solid var(--line); overflow: hidden; background: #fff; transition: width .18s ease; display: flex; flex-direction: column; }
  .drawer.open { width: 380px; border-left-width: 1px; }
  @media (max-width: 900px) { .drawer.open { position: fixed; right: 0; top: 52px; bottom: 0; width: min(380px, 92vw); z-index: 5; } }
  .drawer header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); min-width: 300px; }
  .drawer header b { font-size: 14px; font-weight: 600; color: var(--ink); }
  .drawer .body { padding: 6px 16px 24px; overflow-y: auto; min-width: 300px; }
  .drawer h3 { font-size: 11.5px; font-weight: 500; color: var(--micro); margin: 18px 0 6px; }
  .drawer ul { margin: 0; padding: 0; list-style: none; }
  .drawer li { font-size: 13px; padding: 8px 0; border-top: 1px solid var(--line); }
  .drawer li:first-child { border-top: 0; }
  .drawer li small { display: block; color: var(--mute); font-size: 12px; margin-top: 2px; }
  @media (prefers-reduced-motion: reduce) { .sidebar, .drawer { transition: none; } }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <button class="proj" data-go="projects" title="Đổi dự án">
    <svg class="i"><use href="#i-folder"/></svg>
    <span><b>Oan Khuất Giữa Cánh Đồng Ngô</b><small>Vụ án có thật · 72 cảnh</small></span>
  </button>
  <div class="navscroll">
    <div class="micro">Làm video</div>
    <button class="nav" data-go="idea"><svg class="i"><use href="#i-bulb"/></svg>Ý tưởng<span class="num">1</span></button>

    <button class="nav" data-go="projects"><svg class="i"><use href="#i-folder"/></svg>Dự án</button>
    <button class="nav" data-go="gallery"><svg class="i"><use href="#i-image"/></svg>Thư viện Muse</button>
    <div class="micro">Ghi chú thiết kế (không có trong app thật)</div>
    <button class="nav" data-go="map"><svg class="i"><use href="#i-layers"/></svg>Gom tính năng trùng</button>

    <button class="nav" data-go="accounts"><svg class="i"><use href="#i-key"/></svg>Tài khoản và kết nối<span class="dot" title="2 tài khoản Muse sẵn sàng"></span></button>

</aside>

<div class="main">
  <div class="top">
    <div class="left">
      <button class="icon-btn" id="btn-side" aria-label="Ẩn hoặc hiện thanh bên"><svg class="i"><use href="#i-panel"/></svg></button>
      <div class="crumb" id="crumb"></div>

</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></symbol>

<script>
/* =====================================================================
   BẢNG GOM TÍNH NĂNG. Chữ trong ` ` là id hoặc tên hàm đang có thật trong code.
   to: trang mới duy nhất. how: gom | chuyen | cat | bo | moi
   ===================================================================== */
const MAP = [
  { f: "Nhập nội dung", n: 4, to: "idea", how: "gom", now: "Bước 1 `#step1-script-textarea`; cửa sổ Hồ Sơ Kỳ Án `#tc-case-text`; cửa sổ Kịch bản AI `#import-script-textarea`; cửa sổ 9-Grid Spec `#master-sb-script-text`", note: "Một ô dán duy nhất." },
  { f: "Chọn thể loại", n: 4, to: "idea", how: "gom", now: "Ô `#step1-content-kind`; nút `#btn-open-true-crime-modal`; nút `#btn-step1-open-true-crime`; nút `#btn-open-comic-modal`", note: "Một hàng thẻ thể loại. Thể loại mới sau này chỉ là thêm một thẻ." },
  { f: "Truyện tranh (cắt khung)", n: 2, to: "idea", how: "gom", now: "Bước 1 (`#step1-comic-dropzone`, `#step1-comic-mode`, `#step1-comic-order`); cửa sổ `#modal-comic-slicer` (`#comic-layout-mode`, `#comic-reading-order`)", note: "Hiện ra khi chọn thẻ Truyện tranh." },
  { f: "Số phút của vụ án", n: 2, to: "idea", how: "gom", now: "`#step1-case-duration`; `#tc-duration-select`", note: "" },
  { f: "Tuỳ chọn máy chia cảnh, nhịp kể", n: 4, to: "idea", how: "cat", now: "`#step1-engine-select`; `#step1-pacing-select`; `#tc-vision-engine`; `#split-mode-select`", note: "Cất vào nút Tuỳ chọn, mặc định không hiện." },
  { f: "Dàn ý, tên hư cấu, cảnh báo của vụ án", n: 1, to: "script", how: "chuyen", now: "Cửa sổ `#modal-true-crime` (`#tc-outline-parts`, `#tc-entity-table`, `#tc-warnings`)", note: "Từ cửa sổ nổi thành hai thẻ trong trang, chỉ hiện với thể loại Vụ án." },
  { f: "Sửa lời kể từng cảnh", n: 2, to: "script", how: "gom", now: "Thẻ cảnh ở Bảng Đạo Diễn (`updateSceneText()`); cửa sổ Hồ Sơ Kỳ Án `#tc-scene-review`", note: "" },
  { f: "Thêm, xoá, đổi thứ tự cảnh", n: 1, to: "script", how: "chuyen", now: "Bảng Đạo Diễn: `#btn-add-scene`, `moveScene()`, `duplicateScene()`, `deleteScene()`", note: "Cảnh là đơn vị của lời kể nên sửa cấu trúc ở trang lời kể." },
  { f: "Chọn giọng, nghe thử", n: 3, to: "script", how: "gom", now: "`#select-voice` và `#btn-preview-voice-sample`; `#tc-voice-vi`; `#tc-voice-en`", note: "" },
  { f: "Thu giọng", n: 4, to: "script", how: "gom", now: "Nút Voice trên thẻ (`regenerateSceneVoice()`); `#btn-auto-gen-all`; `#btn-regen-all-voices`; giai đoạn 2 lúc dựng", note: "Giọng có trước thì mới biết mỗi cảnh dài bao nhiêu giây để làm video." },
  { f: "Phong cách hình", n: 6, to: "idea", how: "gom", now: "`#step1-style-select`; `#tc-visual-style`; `#select-project-style`; `#split-style-select`; `#edit-char-style`; ô gõ `#master-sb-style-dna`", note: "Chọn một lần ở trang Ý tưởng, vì AI viết mô tả ảnh theo phong cách ngay lúc viết kịch bản. Hình mẫu chỉ hiện và cho đổi kèm cảnh báo." },
  { f: "Nhân vật", n: 3, to: "look", how: "gom", now: "Bước 1 (`#step1-char-preset-select`, `#step1-char-name`, `#step1-char-anchor`, ảnh tham chiếu); cửa sổ cũ `#modal-character-editor`; cửa sổ mới `#modal-character-sheets`", note: "Giữ bảng nhân vật mới. Hai cách cũ app đã tự bỏ qua khi có bảng nhân vật, nên đề xuất gỡ khỏi giao diện." },

/* ---------- Ngăn kéo ---------- */
function openDrawer(key) {
  const [kind, arg] = key.split(":");
  let title = "", html = "";
  if (kind === "map") {
    const rows = MAP.filter((m) => m.to === arg);
    title = "Gom về “" + PAGES[arg] + "”";
    html = `<h3>${rows.length} nhóm tính năng chuyển về trang này</h3><ul>` +
      rows.map((m) => `<li><b style="font-weight:500">${esc(m.f)}</b> <span class="tag ${m.how === "moi" ? "solid" : ""}">${HOW[m.how]}</span><small>Hiện ở ${m.n || 0} nơi: ${fmt(m.now)}</small>${m.note ? `<small>${fmt(m.note)}</small>` : ""}</li>`).join("") + "</ul>";
  } else if (kind === "scene") {
    const n = String(arg).padStart(3, "0");
    title = "Cảnh " + n;
    html = `<div class="ph" style="margin-top:12px">Ảnh hoặc clip của cảnh ${n}</div>
      <h3>Hình</h3><ul><li>Vẽ lại ảnh<small>Tự kèm khoá nhân vật và khoá bối cảnh</small></li><li>Lưới 9 ô<small>Duyệt, hoặc ghi chỗ sai rồi vẽ lại</small></li><li>Clip<small>Điểm cử động 26,5 · Làm lại cảnh này</small></li><li>Đã xem, có cử động</li></ul>
      <h3>Nguồn khác</h3><ul><li>Tải ảnh hoặc video riêng từ máy</li><li>Chọn từ Thư viện Muse</li></ul>
      <h3>Nhân vật có mặt</h3><ul><li>Chu Khải Phong, Tống Lan Phương<small>Sửa ở bước 3, Hình mẫu</small></li></ul>
      <h3>Nâng cao</h3><ul><li>Prompt ảnh, prompt video, chuyển động máy quay</li><li>Video theo lời thoại (cách cũ)</li></ul>`;
  } else if (kind === "opts") {
    title = "Tuỳ chọn";
    html = `<h3>Ít khi cần đổi</h3><ul><li>Nhịp kể<small>Hiện là ô <code>#step1-pacing-select</code></small></li><li>Máy chia cảnh<small>Hiện là <code>#step1-engine-select</code>, <code>#tc-vision-engine</code></small></li></ul>`;
  } else if (kind === "render") {
    title = "Tuỳ chỉnh dựng";
    html = `<h3>Âm thanh</h3><ul><li>Nhạc nền<small><code>#select-bgm</code>, tải nhạc riêng</small></li><li>Tự hạ nhạc khi có giọng<small><code>#toggle-audio-ducking</code></small></li></ul>
      <h3>Hình</h3><ul><li>Kiểu phụ đề<small><code>#select-subtitle-style</code>, <code>#toggle-hardsub</code></small></li><li>Chuyển cảnh<small><code>#select-transition</code></small></li></ul>`;
  }
  $("drawer-title").textContent = title;
  $("drawer-body").innerHTML = html;
  $("drawer").classList.add("open");
}
function closeDrawer() { $("drawer").classList.remove("open"); }

/* ---------- Điều hướng ---------- */
function render() {
  $("canvas").innerHTML = RENDER[view.page]();
  document.querySelectorAll(".nav[data-go]").forEach((b) => {
    if (b.dataset.go === view.page) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const step = ["idea", "script", "look", "scenes", "publish"].indexOf(view.page);
  $("crumb").innerHTML = (step >= 0 ? "Oan Khuất Giữa Cánh Đồng Ngô / " : "") + "<b>" + esc(PAGES[view.page]) + "</b>";
  document.querySelector(".scroll").scrollTop = 0;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-genre],[data-tab],[data-drawer]");
  if (!t) return;
  if (t.dataset.go) { view.page = t.dataset.go; closeDrawer(); render(); }
  else if (t.dataset.genre) { view.genre = t.dataset.genre; render(); }
  else if (t.dataset.tab) { view.tab = t.dataset.tab; render(); }
  else if (t.dataset.drawer) openDrawer(t.dataset.drawer);
});
$("btn-side").addEventListener("click", () => document.body.classList.toggle("collapsed"));
$("btn-drawer-close").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
if (window.innerWidth < 860) document.body.classList.add("collapsed");
render();
</script>
